<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackED</title>
    <link rel="icon" type="image/png" href="images/TrackEd Logo 2.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header>
        <div class="left-menu">
            <img src="images/TrackEd Logo 2.png" alt="TrackED Logo" class="logo">
            <h4>TrackED Portal</h4>
        </div>

        <div class="right-menu">
            <a href="mailto:TrackEDgmail.com">Contact</a>
            <a href="#">Help</a>
            <a href="#">About</a>
            <a href="#">Terms</a>
        </div>
    </header>
    <main>
        <div class="welcome-content">
            <h1>Welcome to TrackED</h1>
            <p>
                Track you academic progress,
                manage your records, and stay organized.
            </p>
        </div>
        
        <div class="login-container">
            <h2>Login</h2>

            <form action="#">
                <div class="input-group">
                    <i class="fa-solid fa-user icon"></i>
                    <input type="text" id="username" placeholder="Student ID/Faculty ID" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fa-solid fa-eye toggle password" id="togglePassword"></i>
                </div>

                <a href="dashboard.html"><button type="button">Sign In</button></a>

                <p class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </p>
            </form>
        </div>
    </main>

    <footer>
        <div class="left-side">
            <p>TrackED.
                <br>Track your academic progress with ease.
            </p>
            <p>&copy; 2026 TrackED. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="/js/index.js"></script>
</body>

</html>
